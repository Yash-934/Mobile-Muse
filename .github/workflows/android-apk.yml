name: Build OpenMuse Mobile Android APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.x & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure .env for Secrets Gradle Plugin
        env:
          GH_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$GH_GEMINI_KEY" ]; then
            echo "GEMINI_API_KEY=$GH_GEMINI_KEY" > .env
          fi

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Integration Tests
        run: |
          set -o pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build_test.log
          else
            gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build_test.log
          fi

      - name: Assemble Installable Debug APK
        run: |
          set -o pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a build_test.log
          else
            gradle :app:assembleDebug --stacktrace 2>&1 | tee -a build_test.log
          fi
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build and Test Logs (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-mobile-build-logs
          path: |
            build_test.log
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
